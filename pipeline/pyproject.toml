[project]
name = "geno-pipeline"
version = "0.1.0"
description = "Geno — socle de données et reconstruction 3D du génome humain"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Pile de conformation. Volontairement optionnelle : le socle 1D dont dépend le
# viewer ne doit pas traîner scipy et h5py derrière lui.
# pandas<3 : cooltools 0.7.1 appelle .idxmin() sur une colonne toute-NA dans
# api/dotfinder.py:977, ce qui lève sous pandas 3. Voir docs/SETUP.md.
# zarr<3 : zarr 3 a remplacé create_dataset par create_array et changé la
# sémantique de open_group. Le magasin d'ensembles écrit en API 2. Voir docs/SETUP.md.
hic = [
    "cooler>=0.10",
    "cooltools>=0.7",
    "pandas>=2,<3",
    "scipy",
    "h5py",
    "bioframe",
    "zarr>=2.16,<3",
]

[project.scripts]
geno = "geno_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["geno_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
